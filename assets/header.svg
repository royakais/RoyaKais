<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .t { font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .ln { animation: show .35s ease-out backwards; }
    .l1 { animation-delay:.3s } .l2 { animation-delay:1.1s } .l3 { animation-delay:1.7s } .l4 { animation-delay:2.3s } .l5 { animation-delay:2.9s } .l6 { animation-delay:3.5s }
    @keyframes show { from { opacity:0 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform:translateY(-40px) } to { transform:translateY(360px) } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="360" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#0D1117"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="url(#sc)"/>
    <rect x="0" y="0" width="1200" height="40" fill="#161B22"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#30363D"/>
    <circle cx="26" cy="20" r="6.5" fill="#FF5F57"/><circle cx="48" cy="20" r="6.5" fill="#FEBC2E"/><circle cx="70" cy="20" r="6.5" fill="#28C840"/>
    <text class="t" x="600" y="25" text-anchor="middle" font-size="13" fill="#8B949E">roya@usek: ~/portfolio — zsh — 2026</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="14" fill="none" stroke="url(#glow)" stroke-opacity=".7"/>
  <g class="t" font-size="20">
    <text class="ln l1" x="48" y="92"><tspan fill="#4ADE80">roya@usek</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#22D3EE">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text>
  </g>
  <text class="t ln l2" x="46" y="176" font-size="74" font-weight="700" fill="url(#glow)" letter-spacing="2">ROYA_KAIS</text>
  <g class="t" font-size="20">
    <text class="ln l3" x="48" y="218" fill="#8B949E">&gt; <tspan fill="#E6EDF3">Software Engineer</tspan> <tspan fill="#A78BFA">|</tspan> <tspan fill="#E6EDF3">Full-Stack</tspan> <tspan fill="#A78BFA">|</tspan> <tspan fill="#E6EDF3">Data &amp; Machine Learning</tspan></text>
    <text class="ln l4" x="48" y="252" fill="#8B949E">&gt; status: <tspan fill="#4ADE80">● online</tspan>  ·  location: <tspan fill="#22D3EE">Lebanon</tspan>  ·  build: <tspan fill="#F472B6">B.S. CS @ USEK, Dec 2026</tspan></text>
    <text class="ln l5" x="48" y="308"><tspan fill="#4ADE80">roya@usek</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#22D3EE">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">./start --open-to-work </tspan><tspan class="cur" fill="#22D3EE">_</tspan></text>
  </g>
  <g class="t ln l4" font-size="12" fill="#22D3EE" fill-opacity=".35" text-anchor="end">
    <text x="1160" y="80">0x52 0x4F 0x59 0x41</text>
    <text x="1160" y="100">01010010 01001011</text>
    <text x="1160" y="120">{ ml: true, fullstack: true }</text>
  </g>
</svg>
